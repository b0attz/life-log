<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Log — บันทึกชีวิต</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9c3b22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Trirong:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
</head>
<body>

<!-- ========== AUTH SCREEN ========== -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h1 class="auth-logo">Life <span>Log</span></h1>
    <p class="auth-sub">บันทึกชีวิตของคุณ</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab">เข้าสู่ระบบ</button>
      <button class="auth-tab" id="signupTab">สมัครสมาชิก</button>
    </div>

    <form class="auth-form" id="loginForm">
      <input type="email" id="loginEmail" placeholder="อีเมล" required autocomplete="email">
      <input type="password" id="loginPass" placeholder="รหัสผ่าน" required autocomplete="current-password" minlength="6">
      <div style="text-align:right;margin-top:-4px;">
        <button type="button" class="text-link" id="forgotPassBtn">ลืมรหัสผ่าน?</button>
      </div>
      <button type="submit" class="auth-submit">เข้าสู่ระบบ</button>
    </form>

    <form class="auth-form hidden" id="signupForm">
      <input type="email" id="signupEmail" placeholder="อีเมล" required autocomplete="email">
      <input type="password" id="signupPass" placeholder="รหัสผ่าน (≥ 6 ตัวอักษร)" required autocomplete="new-password" minlength="6">
      <button type="submit" class="auth-submit">สมัครสมาชิก</button>
    </form>

    <form class="auth-form hidden" id="resetForm">
      <p style="font-size:.85rem;color:var(--fg-muted);margin-bottom:8px;">ใส่อีเมลของคุณ เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่</p>
      <input type="email" id="resetEmail" placeholder="อีเมล" required autocomplete="email">
      <button type="submit" class="auth-submit">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
      <button type="button" class="text-link" id="backToLogin" style="margin-top:8px;">← กลับไปเข้าสู่ระบบ</button>
    </form>

    <div class="auth-error hidden" id="authError"></div>

    <div class="auth-divider"><span>หรือ</span></div>

    <button class="auth-google-btn" id="googleLoginBtn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      เข้าสู่ระบบด้วย Google
    </button>
  </div>
</div>

<!-- ========== SIDEBAR NAVIGATION ========== -->
<div class="sidebar-overlay hidden" id="sidebarOverlay"></div>
<nav class="sidebar hidden" id="sidebar">
  <div class="sidebar-header">
    <h2>Life <span>Log</span></h2>
    <button class="sidebar-close" id="sidebarClose" aria-label="ปิดเมนู">✕</button>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-email-label">บัญชีของคุณ</div>
    <div class="sidebar-email" id="sidebarEmail"></div>
  </div>
  <div class="sidebar-nav">
    <button class="sidebar-item" id="navFocus">โหมดโฟกัส</button>
    <button class="sidebar-item" id="navGoals">เป้าหมาย</button>
    <button class="sidebar-item" id="navFolders">โฟลเดอร์</button>
    <button class="sidebar-item" id="navTags">แท็ก</button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" id="navDashboard">สถิติ</button>
    <button class="sidebar-item" id="navExport">ส่งออก</button>
    <button class="sidebar-item" id="navImport">นำเข้า</button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" id="navCalendar">ปฏิทิน</button>
    <button class="sidebar-item" id="navTheme">ธีม</button>
    <button class="sidebar-item" id="navDark"><span id="darkLabel">โหมดมืด</span></button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item sidebar-item-danger" id="navLogout">ออกจากระบบ</button>
  </div>
</nav>

<!-- ========== MAIN APP (hidden until auth) ========== -->
<div class="wrap hidden" id="mainApp">
  <!-- Top Bar -->
  <div class="topbar">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="เปิดเมนู">
      <span></span><span></span><span></span>
    </button>
    <h1 class="topbar-title">Life <span>Log</span></h1>
  </div>

  <div class="theme-picker hidden" id="themePicker"></div>

  <div class="calendar-wrap hidden" id="calendarWrap">
    <div class="cal-header">
      <button class="cal-nav" id="calToday">วันนี้</button>
      <button class="cal-nav" id="calPrev" aria-label="เดือนก่อนหน้า">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-nav" id="calNext" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- Stats Summary -->
  <div class="stats-summary" id="statsLine" aria-live="polite">
    <span class="stat-val" id="statTotal">0</span>
    <span class="stat-label">รายการ</span>
    <span class="stat-sep">·</span>
    <span class="stat-val" id="statStreak">0</span>
    <span class="stat-label">วันติด</span>
    <span class="stat-sep">·</span>
    <span class="stat-val" id="statMood">—</span>
  </div>

  <!-- Composer -->
  <div class="composer" id="composer">
    <textarea id="text" placeholder="วันนี้เป็นยังไงบ้าง?…" maxlength="10000" aria-label="เขียนบันทึก" rows="3"></textarea>
    <div class="composer-bar">
      <div class="moods" id="moods"></div>
      <button class="save-btn" id="saveBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
        <span>บันทึก</span>
      </button>
    </div>
    <div class="composer-meta hidden" id="composerMeta">
      <div class="meta-row">
        <input type="text" id="tags" placeholder="แท็ก คั่นด้วยจุลภาค" maxlength="500" aria-label="แท็ก">
        <select id="folderSelect" class="folder-select" aria-label="เลือกโฟลเดอร์">
          <option value="">ไม่มีโฟลเดอร์</option>
        </select>
      </div>
      <label class="image-upload-label" id="imageUploadArea" for="imageInput">เพิ่มรูปภาพ</label>
      <input type="file" id="imageInput" accept="image/*" multiple hidden>
      <div class="image-preview-row" id="imagePreviewRow"></div>
    </div>
    <button type="button" class="meta-toggle" id="metaToggle">รายละเอียด</button>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="ค้นหา..." aria-label="ค้นหารายการ">
    </div>
    <div class="filter-chips">
      <button class="filter-chip" data-range="all">ทั้งหมด</button>
      <button class="filter-chip" data-range="today">วันนี้</button>
      <button class="filter-chip" data-range="week">7 วัน</button>
      <button class="filter-chip" data-range="month">30 วัน</button>
    </div>
  </div>

  <div id="list"></div>

  <footer>ข้อมูลถูกเก็บไว้ใน Supabase · กดส่งออกเพื่อสำรองข้อมูลเป็นระยะ</footer>
</div>

<button class="fab hidden" id="fabBtn" aria-label="เขียนบันทึกใหม่">＋</button>

<div class="onboarding-overlay hidden" id="onboardingOverlay">
  <div class="onboarding-card">
    <div class="onboarding-step" id="onbStep1">
      <h2>ยินดีต้อนรับ</h2>
      <p>บันทึกเรื่องราวในชีวิตของคุณ ในแบบของคุณ</p>
    </div>
    <div class="onboarding-nav">
      <button class="onboarding-btn" id="onbNext">เริ่มใช้</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden role="dialog" aria-modal="true"></div>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="ปิด">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="รูปก่อนหน้า">‹</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="รูปถัดไป">›</button>
  <img class="lightbox-img" id="lightboxImg" alt="">
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>
<input type="file" id="importFile" accept=".json" hidden>

<!-- ========== FOCUS MODE ========== -->
<div class="focus-overlay hidden" id="focusOverlay">
  <button class="focus-close" id="focusClose" aria-label="ปิดโหมดโฟกัส">✕ กลับ</button>
  <textarea class="focus-textarea" id="focusText" placeholder="เขียนอะไรก็ได้...ไม่มีอะไรกวนคุณ" maxlength="10000"></textarea>
  <div class="focus-footer">
    <div class="focus-moods" id="focusMoods"></div>
    <button class="focus-save" id="focusSave">บันทึก</button>
  </div>
</div>
